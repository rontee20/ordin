<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a30"><title>TISA DIGITAL SERVICE</title><style>body{margin:0;background:#101a30;color:#eee;font:15px Arial}*{box-sizing:border-box}button,input,select{font:inherit}header{padding:16px;background:#16233f;position:sticky;top:0}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;background:#f5a623;color:#101a30;border-radius:9px;display:grid;place-items:center;font-weight:900}.tabs{display:flex;gap:5px;overflow:auto;margin-top:12px}.tabs button,.btn{border:1px solid #31436b;background:#1c2c4d;color:#eee;padding:10px;border-radius:8px}.active,.primary{background:#c14e33!important}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#16233f;border:1px solid #31436b;border-radius:12px;padding:15px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.grid{grid-template-columns:1fr}}label{display:block;color:#9aa7c5;font-size:12px;margin:8px 0 5px}input,select{width:100%;padding:10px;border-radius:7px;border:1px solid #31436b;background:#1c2c4d;color:#eee}.row{display:grid;grid-template-columns:1fr 70px 90px 35px;gap:6px;margin:8px 0}.row button{border:0;background:#7c3322;color:#fff;border-radius:6px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.bill{background:#faf6ec;color:#222;padding:18px;border-radius:8px}.bill table{width:100%;border-collapse:collapse}.bill td,.bill th{padding:7px;border-bottom:1px solid #ddd}.history{padding:12px 0;border-bottom:1px solid #31436b;display:grid;grid-template-columns:1fr auto;gap:8px}.muted{color:#9aa7c5;font-size:12px}.danger{color:#ffb4a5}</style></head><body><header><div class="brand"><div class="logo">TDS</div><div><b>TISA DIGITAL SERVICE</b><div class="muted">Offline Billing App</div></div></div><div class="tabs"><button id="n" class="active">New Bill</button><button id="h">History</button><button id="s">Services</button><button id="d">Dashboard</button><button id="logout">Logout</button></div></header><main class="wrap"><section id="login" class="card"><h2>Admin Login</h2><input id="uid" placeholder="User ID"><br><br><input id="pw" type="password" placeholder="Password"><br><br><button class="btn primary" id="loginBtn">Login</button><p id="le" class="danger"></p></section><section id="app" class="hidden"><div id="new" class="card"><h2>New Bill</h2><div class="grid"><div><label>Customer</label><input id="cust"></div><div><label>Phone</label><input id="phone"></div></div><label>Items</label><div id="items"></div><button class="btn" id="add">+ Add Item</button><div class="grid"><div><label>Payment</label><select id="pay"><option>Cash</option><option>UPI</option><option>Card</option><option>Due / Pending</option></select></div><div><label>Discount</label><input id="disc" type="number" value="0"></div></div><br><div class="actions"><button class="btn primary" id="save">Save Bill</button><button class="btn" id="print">Print</button><button class="btn" id="fresh">New</button></div><p id="msg" class="muted"></p></div><div id="history" class="card hidden"><h2>History</h2><div id="hist"></div></div><div id="services" class="card hidden"><h2>Services</h2><div id="svcs"></div><button class="btn" id="addsvc">+ Service</button></div><div id="dash" class="card hidden"><h2>Dashboard</h2><div id="stats"></div></div><div class="bill"><b>TISA DIGITAL SERVICE</b><div>Cyber Café & Online Service Centre</div><hr><div id="preview"></div></div></section></main><script>(function(){const $=id=>document.getElementById(id),KEY='tisa_bills_v1',SKEY='tisa_services_v1',LOCK=15*60*1000;const defaults=[['Xerox B&W',2],['Colour Xerox',5],['Colour Print',10],['B&W Print',5],['Aadhaar Address Change',100],['Aadhaar Mobile Update',100],['PAN Card Apply (New)',160],['Ayushman Bharat eKYC',35],['Ayushman Bharat Update',30],['Balance Check',5],['DBT Link Check',10],['DBT Link',30],['Any PVC Card Print',50],['Ration Card Apply (New)',80],['Ration Card Transfer (Family / Address Change)',50]];let services=JSON.parse(localStorage.getItem(SKEY)||'null')||defaults.map(x=>({name:x[0],rate:x[1]})),items=[{desc:'',qty:1,rate:''}],bills=JSON.parse(localStorage.getItem(KEY)||'[]');function saveS(){localStorage.setItem(SKEY,JSON.stringify(services))}function money(n){return '₹'+Number(n||0).toFixed(2)}function calc(){return items.reduce((a,x)=>a+(+x.qty||0)*(+x.rate||0),0)-Math.min(+$('disc').value||0,items.reduce((a,x)=>a+(+x.qty||0)*(+x.rate||0),0))}function renderItems(){let e=$('items');e.innerHTML='';items.forEach((x,i)=>{let r=document.createElement('div');r.className='row';r.innerHTML='<input placeholder="Service" value="'+x.desc+'"><input type="number" min="0" value="'+x.qty+'"><input type="number" min="0" value="'+x.rate+'"><button>×</button>';let q=r.children[1],rate=r.children[2],desc=r.children[0];desc.oninput=()=>x.desc=desc.value;q.oninput=()=>x.qty=q.value;rate.oninput=()=>x.rate=rate.value;r.lastChild.onclick=()=>{items.splice(i,1);renderItems();preview()};e.appendChild(r)})}function preview(){let html='<table><tr><th>Service</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>';items.forEach(x=>{if(x.desc)html+='<tr><td>'+x.desc+'</td><td>'+x.qty+'</td><td>'+money(x.rate)+'</td><td>'+money((+x.qty||0)*(+x.rate||0))+'</td></tr>'});html+='</table><h3>Total: '+money(calc())+'</h3>';$('preview').innerHTML=html}function renderHist(){let e=$('hist');e.innerHTML=bills.length?bills.map((b,i)=>{let lock=Date.now()-b.savedAt>LOCK;return '<div class="history"><div><b>'+b.no+'</b> · '+(b.customer||'Walk-in')+'<br>'+money(b.total)+'<div class="muted">'+new Date(b.savedAt).toLocaleString()+'</div></div><div><button class="btn" onclick="loadB('+i+')">Open</button> '+(lock?'🔒':'<button class="btn" onclick="delB('+i+')">Delete</button>')+'</div></div>'}).join(''):'No bills yet'}function renderServices(){let e=$('svcs');e.innerHTML=services.map((x,i)=>'<div class="grid"><input value="'+x.name+'" onchange="services['+i+'].name=this.value;saveS()"><input type="number" value="'+x.rate+'" onchange="services['+i+'].rate=this.value;saveS()"></div>').join('')}function tabs(x){['new','history','services','dash'].forEach(k=>$(k).classList.toggle('hidden',k!==x));if(x==='history')renderHist();if(x==='services')renderServices();if(x==='dash')$('stats').innerHTML='<h3>'+bills.length+' bills</h3><h3>'+money(bills.reduce((a,b)=>a+b.total,0))+'</h3>'}$('loginBtn').onclick=()=>{if($('uid').value==='rontee20'&&$('pw').value==='Rana1234@'){$('login').classList.add('hidden');$('app').classList.remove('hidden');renderItems();preview()}else $('le').textContent='Wrong ID or password'};$('logout').onclick=()=>location.reload();$('n').onclick=()=>tabs('new');$('h').onclick=()=>tabs('history');$('s').onclick=()=>tabs('services');$('d').onclick=()=>tabs('dash');$('add').onclick=()=>{items.push({desc:'',qty:1,rate:''});renderItems()};$('addsvc').onclick=()=>{services.push({name:'New service',rate:0});saveS();renderServices()};$('disc').oninput=preview;$('save').onclick=()=>{if(!items.some(x=>x.desc.trim()))return $('msg').textContent='Add a service first.';let no='TDS-'+String(bills.length+1).padStart(4,'0');bills.unshift({no,customer:$('cust').value,phone:$('phone').value,items:JSON.parse(JSON.stringify(items)),total:calc(),savedAt:Date.now()});localStorage.setItem(KEY,JSON.stringify(bills));$('msg').textContent='Saved '+no+'. Delete is available for 15 minutes only.';renderHist()};$('fresh').onclick=()=>{items=[{desc:'',qty:1,rate:''}];$('cust').value='';$('phone').value='';$('disc').value=0;renderItems();preview()};$('print').onclick=()=>window.print();window.loadB=i=>{let b=bills[i];items=b.items.map(x=>({...x}));$('cust').value=b.customer||'';$('phone').value=b.phone||'';renderItems();preview();tabs('new')};window.delB=i=>{if(Date.now()-bills[i].savedAt<=LOCK){bills.splice(i,1);localStorage.setItem(KEY,JSON.stringify(bills));renderHist()}};window.services=services;window.saveS=saveS;setInterval(()=>{if(!$('history').classList.contains('hidden'))renderHist()},1000)})();</script></body></html>
